:root{--paper:#0d0e10;--ink:#f1f0ec;--muted:#8b8c90;--line:#26272b;--gold:#c9a45c}

th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
